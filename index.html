  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

<body>
<div id="game">
  <canvas id="c" width="400" height="600"></canvas>
  <div id="ui">
    <div id="score">0</div>
    <div id="onlineBox">Tổng lượt chơi: <span id="playCount">...</span></div>
    
    <div id="start">
      <h1>GROK BIRD</h1>
      <p>Nhấn Space / Click / Touch để bay<br>Siêu khó như Flappy Bird gốc</p>
      <p style="margin-top:10px;font-size:13px;opacity:0.75">Viral game cho X Timeline</p>
      <button class="btn" onclick="flap()">Chơi ngay</button>
      <button class="btn btn-secondary" onclick="showLeaderboard()">Bảng xếp hạng</button>
    </div>
    
    <div id="gameover" class="hidden">
      <h1>GAME OVER</h1>
      <p id="finalScore">Điểm: 0</p>
      <p id="newRecord" class="hidden" style="color:#FFD700;margin-top:6px">🎉 Kỷ lục mới!</p>
      <button class="btn" onclick="flap()">Chơi lại</button>
      <button class="btn btn-secondary" onclick="showLeaderboard()">Bảng xếp hạng</button>
    </div>
    
    <div id="leaderboard">
      <h2>🏆 Top 10 Thành tích</h2>
      <div id="lbList"></div>
      <button class="btn" style="margin-top:16px" onclick="hideLeaderboard()">Đóng</button>
    </div>
  </div>

  <!-- Nút bật/tắt nhạc nền -->
  <button id="bgmToggle" onclick="toggleBGM()" title="Bật/Tắt nhạc nền">🔊</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const startEl = document.getElementById('start');
const gameoverEl = document.getElementById('gameover');
const finalScoreEl = document.getElementById('finalScore');
const newRecordEl = document.getElementById('newRecord');
const playCountEl = document.getElementById('playCount');
const lbList = document.getElementById('lbList');
const leaderboardEl = document.getElementById('leaderboard');
const bgmToggleBtn = document.getElementById('bgmToggle');

// ===== ÂM THANH =====
let audioCtx = null;
let bgmEnabled = true;          // trạng thái bật/tắt nhạc nền
let bgmPlaying = false;
let bgmNodes = [];              // lưu các oscillator/gain đang chạy để dừng được

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  if (type === 'flap') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
    osc.start(now); osc.stop(now + 0.08);
  } else if (type === 'score') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.setValueAtTime(1200, now + 0.05);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
    osc.start(now); osc.stop(now + 0.12);
  } else if (type === 'die') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.start(now); osc.stop(now + 0.35);
  }
}

// ===== NHẠC NỀN (BGM) – Chiptune vui =====
function playBGM() {
  if (!audioCtx || bgmPlaying || !bgmEnabled) return;
  bgmPlaying = true;
  bgmNodes = [];

  // Giai điệu đơn giản, vui, lặp lại (nốt tần số Hz)
  const melody = [
    {f: 523.25, d: 0.18}, // C5
    {f: 659.25, d: 0.18}, // E5
    {f: 783.99, d: 0.18}, // G5
    {f: 659.25, d: 0.18}, // E5
    {f: 587.33, d: 0.18}, // D5
    {f: 523.25, d: 0.18}, // C5
    {f: 440.00, d: 0.25}, // A4
    {f: 0,     d: 0.12},     // nghỉ
    {f: 523.25, d: 0.18},
    {f: 659.25, d: 0.18},
    {f: 783.99, d: 0.18},
    {f: 880.00, d: 0.28}, // A5
    {f: 783.99, d: 0.18},
    {f: 659.25, d: 0.25},
    {f: 0,     d: 0.15}
  ];

  let time = audioCtx.currentTime + 0.05;

  function scheduleLoop() {
    if (!bgmPlaying || !bgmEnabled) return;

    melody.forEach(note => {
      if (note.f === 0) {
        time += note.d;
        return;
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';          // âm chiptune
      osc.frequency.value = note.f;
      gain.gain.setValueAtTime(0.08, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + note.d);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(time);
      osc.stop(time + note.d + 0.05);
      bgmNodes.push(osc, gain);
      time += note.d;
    });

    // Lặp lại sau khi hết giai điệu
    const totalDuration = melody.reduce((s, n) => s + n.d, 0);
    setTimeout(() => {
      if (bgmPlaying && bgmEnabled) {
        time = audioCtx.currentTime + 0.02;
        scheduleLoop();
      }
    }, totalDuration * 1000 - 50);
  }

  scheduleLoop();
}

function stopBGM() {
  bgmPlaying = false;
  // Dừng tất cả oscillator đang chạy
  bgmNodes.forEach(node => {
    try { node.stop && node.stop(); } catch(e) {}
  });
  bgmNodes = [];
}

function toggleBGM() {
  bgmEnabled = !bgmEnabled;
  bgmToggleBtn.textContent = bgmEnabled ? '🔊' : '🔇';
  if (!bgmEnabled) {
    stopBGM();
  } else if (state === 'play') {
    playBGM();
  }
}

// ===== CẤU HÌNH =====
const GRAVITY = 0.45;
const FLAP = -7.8;
const PIPE_SPEED = 3.2;
const PIPE_GAP = 118;
const PIPE_WIDTH = 62;
const PIPE_INTERVAL = 1600;
const BIRD_SIZE = 28;

let bird = { x: 80, y: 280, vy: 0, r: BIRD_SIZE/2 };
let pipes = [];
let score = 0;
let highScore = parseInt(localStorage.getItem('grokBirdHigh') || '0');
let state = 'start';
let lastPipe = 0;
let frame = 0;

// ===== LEADERBOARD (local) =====
function getLeaderboard() {
  return JSON.parse(localStorage.getItem('grokBirdLB') || '[]');
}
function saveLeaderboard(list) {
  localStorage.setItem('grokBirdLB', JSON.stringify(list));
}
function addScoreToLB(name, points) {
  let list = getLeaderboard();
  list.push({ name: name || 'Ẩn danh', score: points, date: new Date().toLocaleDateString('vi-VN') });
  list.sort((a, b) => b.score - a.score);
  list = list.slice(0, 10);
  saveLeaderboard(list);
  return list;
}
function renderLeaderboard() {
  const list = getLeaderboard();
  if (list.length === 0) {
    lbList.innerHTML = '<p style="opacity:0.7">Chưa có thành tích nào.<br>Hãy chơi và phá kỷ lục!</p>';
    return;
  }
  lbList.innerHTML = list.map((item, i) => `
    <div class="lb-item">
      <span class="lb-rank">#${i+1}</span>
      <span class="lb-name">${item.name}</span>
      <span class="lb-score">${item.score}</span>
    </div>
  `).join('');
}
function showLeaderboard() {
  renderLeaderboard();
  leaderboardEl.style.display = 'block';
}
function hideLeaderboard() {
  leaderboardEl.style.display = 'none';
}

// ===== ĐẾM LƯỢT CHƠI (CountAPI) =====
const COUNTER_KEY = 'grokbird-matrixprovip-2026';
function updatePlayCount() {
  fetch(`https://countapi.mileshilliard.com/api/v1/hit/${COUNTER_KEY}`)
    .then(r => r.json())
    .then(data => {
      if (data && data.value) playCountEl.textContent = Number(data.value).toLocaleString('vi-VN');
    })
    .catch(() => playCountEl.textContent = '—');
}
updatePlayCount();

// ===== GAME LOGIC =====
function reset() {
  bird = { x: 80, y: 280, vy: 0, r: BIRD_SIZE/2 };
  pipes = [];
  score = 0;
  lastPipe = 0;
  frame = 0;
  scoreEl.textContent = '0';
  state = 'play';
  startEl.classList.add('hidden');
  gameoverEl.classList.add('hidden');
  newRecordEl.classList.add('hidden');
  hideLeaderboard();

  // Bắt đầu nhạc nền
  playBGM();
}

function flap() {
  initAudio();
  if (state === 'start' || state === 'over') {
    reset();
    playSound('flap');
  } else if (state === 'play') {
    bird.vy = FLAP;
    playSound('flap');
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); flap(); }
});
canvas.addEventListener('click', flap);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); });

function spawnPipe() {
  const minH = 60;
  const maxH = canvas.height - PIPE_GAP - 120;
  const topH = Math.random() * (maxH - minH) + minH;
  pipes.push({ x: canvas.width, top: topH, bottom: topH + PIPE_GAP, passed: false });
}

function update() {
  if (state !== 'play') return;
  bird.vy += GRAVITY;
  bird.y += bird.vy;

  if (bird.y + bird.r > canvas.height - 40 || bird.y - bird.r < 0) die();

  if (performance.now() - lastPipe > PIPE_INTERVAL) {
    spawnPipe();
    lastPipe = performance.now();
  }

  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= PIPE_SPEED;

    if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_WIDTH) {
      if (bird.y - bird.r < p.top || bird.y + bird.r > p.bottom) die();
    }

    if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
      p.passed = true;
      score++;
      scoreEl.textContent = score;
      playSound('score');
    }
    if (p.x + PIPE_WIDTH < 0) pipes.splice(i, 1);
  }
}

function die() {
  if (state === 'over') return;
  state = 'over';
  playSound('die');
  stopBGM();   // Dừng nhạc nền khi chết
  
  finalScoreEl.textContent = `Điểm: ${score}  |  Best: ${Math.max(score, highScore)}`;
  
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('grokBirdHigh', highScore);
    newRecordEl.classList.remove('hidden');
    
    setTimeout(() => {
      const name = prompt('🎉 Kỷ lục mới! Nhập tên của bạn:', localStorage.getItem('grokBirdName') || '');
      if (name !== null) {
        localStorage.setItem('grokBirdName', name.trim() || 'Ẩn danh');
        addScoreToLB(name.trim() || 'Ẩn danh', score);
      }
    }, 300);
  }
  
  gameoverEl.classList.remove('hidden');
}

function draw() {
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // mây
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.arc(80 + (frame*0.2)%500, 80, 30, 0, Math.PI*2);
  ctx.arc(120 + (frame*0.2)%500, 70, 40, 0, Math.PI*2);
  ctx.arc(160 + (frame*0.2)%500, 85, 28, 0, Math.PI*2);
  ctx.fill();

  // đất
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
  ctx.fillStyle = '#228B22';
  ctx.fillRect(0, canvas.height - 40, canvas.width, 12);

  // ống
  pipes.forEach(p => {
    ctx.fillStyle = '#1DA1F2';
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
    ctx.fillStyle = '#0d8ddb';
    ctx.fillRect(p.x - 4, p.top - 24, PIPE_WIDTH + 8, 24);
    ctx.fillStyle = '#1DA1F2';
    ctx.fillRect(p.x, p.bottom, PIPE_WIDTH, canvas.height - p.bottom - 40);
    ctx.fillStyle = '#0d8ddb';
    ctx.fillRect(p.x - 4, p.bottom, PIPE_WIDTH + 8, 24);
  });

  // bird
  ctx.save();
  ctx.translate(bird.x, bird.y);
  const angle = Math.min(Math.max(bird.vy * 0.06, -0.6), 0.9);
  ctx.rotate(angle);
  ctx.fillStyle = '#1DA1F2';
  ctx.beginPath();
  ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(8, -6, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(10, -6, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.moveTo(bird.r - 4, 0);
  ctx.lineTo(bird.r + 12, -4);
  ctx.lineTo(bird.r + 12, 4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#0d8ddb';
  ctx.beginPath();
  ctx.ellipse(-6, 4, 12, 7, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  if (state === 'play' || state === 'over') {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('𝕏', bird.x, bird.y + 5);
  }
}

function loop() {
  frame++;
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
